# Railway: сервис ключей (Root Directory = e2ee-key-server). Публичный домен
# ему не нужен — основной сервер ходит к нему по частной сети.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
